<!DOCTYPE html><html lang="pt-BR"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>SpartaMC - Configurações</title>    <link rel="icon" type="image/png" href="images/logo.png">    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">    <link rel="stylesheet" href="css/style.css">    <style>        .settings-container {            max-width: 600px;            margin: 100px auto 50px;            padding: 30px;            background: var(--bg-card);            border-radius: 20px;            border: 1px solid var(--border);        }        .settings-header {            display: flex;            align-items: center;            gap: 15px;            margin-bottom: 30px;            padding-bottom: 20px;            border-bottom: 1px solid var(--border);        }        .settings-header img {            width: 60px;            height: 60px;            border-radius: 12px;        }        .settings-header h2 {            font-size: 1.5rem;        }        .discord-connected-card {            position: relative;            padding: 0;            background: var(--discord-bg, #313338);            border: none;            border-radius: 16px;            overflow: hidden;            transition: background 0.3s;        }        .discord-cover-wrapper {            width: 100%;            height: 90px;            background: #1e1f22;            overflow: hidden;        }        .discord-connected-banner {            width: 100%;            height: 100%;            object-fit: cover;            opacity: 0.7;        }        .discord-connected-avatar-wrapper {            position: absolute;            top: 35px;            left: 20px;        }        .discord-connected-avatar {            width: 90px;            height: 90px;            border-radius: 50%;            border: 5px solid var(--discord-bg, #313338);            object-fit: cover;        }        .discord-status-indicator {            position: absolute;            bottom: 5px;            right: 5px;            width: 28px;            height: 28px;            border-radius: 50%;            border: 5px solid var(--discord-bg, #313338);        }        .discord-status-indicator.online { background: #23a55a; box-shadow: 0 0 8px #23a55a; }        .discord-status-indicator.idle { background: #f0b232; box-shadow: 0 0 8px #f0b232; }        .discord-status-indicator.dnd { background: #f23f43; box-shadow: 0 0 8px #f23f43; }        .discord-status-indicator.offline { background: #80848e; box-shadow: none; }        .discord-connected-info {            padding: 20px;            padding-top: 55px;        }        .discord-connected-name {            font-weight: 700;            font-size: 1.25rem;            color: #fff;            display: flex;            align-items: center;            gap: 8px;        }        .discord-connected-name .verified-icon {            color: #5865F2;            font-size: 1rem;        }        .discord-connected-username {            font-size: 0.9rem;            color: #a3a3a3;            margin-top: 4px;        }        .discord-connected-bio {            font-size: 0.85rem;            color: #b5bac1;            margin-top: 12px;            padding: 10px 12px;            background: #2a2b2f;            border-radius: 8px;        }        .discord-badges {            display: flex;            gap: 6px;            margin-top: 12px;            flex-wrap: wrap;        }        .discord-badge-item {            display: flex;            align-items: center;            gap: 4px;            padding: 4px 8px;            background: #2a2b2f;            border-radius: 12px;            font-size: 0.7rem;            color: #b5bac1;        }        .discord-badge-item.staff { background: #5865F2; color: #fff; }        .discord-badge-item.partner { background: #d4a8ff; color: #1e1f22; }        .discord-badge-item.boost { background: #da73e2; color: #fff; }        .discord-badge-item.early { background: #f0b232; color: #1e1f22; }        .discord-badge-item.hypesquad { background: #f0b232; color: #1e1f22; }        .discord-badge-item.bug { background: #f23f43; color: #fff; }        .discord-badge-item.translator { background: #23a55a; color: #fff; }        .discord-badge-item.active-dev { background: #3ba55c; color: #fff; }        .unlink-btn {            position: absolute;            top: 10px;            right: 10px;            background: rgba(0,0,0,0.3);            border: none;            color: #ed4245;            cursor: pointer;            font-size: 0.8rem;            padding: 8px 14px;            border-radius: 8px;            transition: background 0.2s;        }        .unlink-btn:hover {            background: rgba(237, 68, 69, 0.3);        }        @media (max-width: 500px) {            .user-profile-card {                flex-direction: column;                text-align: center;            }            .user-account-info {                justify-content: center;            }        }        .settings-section {            margin-bottom: 25px;        }        .settings-section h3 {            font-size: 1rem;            color: var(--primary);            margin-bottom: 15px;            display: flex;            align-items: center;            gap: 8px;        }        .form-group {            margin-bottom: 15px;        }        .form-group label {            display: block;            font-size: 0.85rem;            color: #888;            margin-bottom: 5px;        }        .form-group input {            width: 100%;            padding: 12px 15px;            background: #1a1a1a;            border: 1px solid var(--border);            border-radius: 10px;            color: #fff;            font-size: 0.95rem;        }        .form-group input:focus {            outline: none;            border-color: var(--primary);        }        .btn-save {            background: var(--primary);            color: #000;            border: none;            padding: 12px 30px;            border-radius: 10px;            font-weight: 700;            cursor: pointer;            transition: var(--transition);            width: 100%;            margin-top: 10px;        }        .btn-save:hover {            background: var(--primary-hover);            transform: translateY(-2px);        }        .success-msg {            background: rgba(34, 197, 94, 0.1);            border: 1px solid #22c55e;            color: #22c55e;            padding: 12px;            border-radius: 10px;            margin-bottom: 15px;            display: none;        }        .error-msg {            background: rgba(255, 68, 68, 0.1);            border: 1px solid #ff4444;            color: #ff4444;            padding: 12px;            border-radius: 10px;            margin-bottom: 15px;            display: none;        }        .back-btn {            color: var(--primary);            text-decoration: none;            font-weight: 600;            display: inline-flex;            align-items: center;            gap: 8px;            margin-bottom: 20px;        }        .back-btn:hover {            text-decoration: underline;        }    </style></head><body>    <header>        <div class="header-container">            <a href="/" class="logo-container">                <img src="images/logo.png" alt="SpartaMC Logo" class="header-logo-img">                <span class="brand-name">SpartaMC</span>            </a>            <div class="header-buttons">                <a href="/" class="cart-btn"><i class="fas fa-home"></i> Início</a>            </div>        </div>    </header>    <div class="settings-container">        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Voltar</a>                <div class="settings-header">            <img id="userAvatar" src="" alt="Skin">            <div>                <h2>Configurações</h2>                <p style="color: #666; font-size: 0.9rem;" id="userEmailDisplay"></p>            </div>        </div>        <div class="success-msg" id="successMsg">            <i class="fas fa-check-circle"></i> <span id="successText">Configurações salvas com sucesso!</span>        </div>        <div class="error-msg" id="errorMsg">            <i class="fas fa-exclamation-circle"></i> <span id="errorText">Erro ao salvar!</span>        </div>        <form id="settingsForm">            <div class="settings-section">                <h3><i class="fas fa-user"></i> Dados da Conta</h3>                <div class="form-group">                    <label>Nickname (Minecraft)</label>                    <input type="text" id="settingsNickname" required>                </div>                <div class="form-group">                    <label>E-mail</label>                    <input type="email" id="settingsEmail" required>                </div>            </div>            <div class="settings-section">                <h3><i class="fas fa-lock"></i> Segurança</h3>                <div class="form-group">                    <label>Nova Senha (deixe em branco para manter)</label>                    <input type="password" id="settingsPassword" placeholder="••••••••">                </div>                <div class="form-group">                    <label>Confirmar Senha</label>                    <input type="password" id="settingsConfirmPassword" placeholder="••••••••">                </div>            </div>            <div class="settings-section">                <h3><i class="fab fa-discord"></i> Discord</h3>                <div id="discordNotLinked">                    <p style="color: #888; margin-bottom: 15px;">Vincule sua conta do Discord para verificar sua identidade automaticamente.</p>                    <button type="button" id="linkDiscordBtn" onclick="linkDiscord()" style="background: #5865F2; color: #fff; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;">                        <i class="fab fa-discord"></i> Vincular Discord                    </button>                </div>                <div id="discordLinked" style="display: none;">                    <div class="discord-connected-card">                        <div class="discord-cover-wrapper">                            <img id="linkedDiscordBanner" class="discord-connected-banner">                        </div>                        <div class="discord-connected-avatar-wrapper">                            <img id="linkedDiscordAvatar" class="discord-connected-avatar">                            <div class="discord-status-indicator" id="discordStatus"></div>                        </div>                        <div class="discord-connected-info">                            <div class="discord-connected-name" id="linkedDiscordDisplayName"></div>                            <div class="discord-connected-username" id="linkedDiscordUsername"></div>                            <div class="discord-connected-bio" id="linkedDiscordBio"></div>                            <div class="discord-badges" id="discordBadges"></div>                        </div>                        <button type="button" onclick="unlinkDiscord()" class="unlink-btn">                            <i class="fas fa-unlink"></i> Desvincular                        </button>                    </div>                </div>            </div>            <button type="submit" class="btn-save">Salvar Configurações</button>        </form>    </div>    <script src="js/crypto.js"></script>    <script>        const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'            ? 'http://localhost:3000/api'            : '/api';        let currentUser = null;        // ── helpers ──────────────────────────────────────────────        function notify(msg, type = 'success') {            document.querySelector('.site-notification')?.remove();            const n = document.createElement('div');            n.className = 'site-notification ' + type;            n.textContent = msg;            const bg = type === 'success' ? 'rgba(34,197,94,0.95);border:1px solid #22c55e'                      : type === 'info'    ? 'rgba(59,130,246,0.95);border:1px solid #3b82f6'                      :                     'rgba(239,68,68,0.95);border:1px solid #ef4444';            n.style.cssText = `position:fixed;top:20px;right:20px;padding:15px 20px;border-radius:10px;color:#fff;font-weight:600;z-index:10000;max-width:350px;background:${bg}`;            document.body.appendChild(n);            setTimeout(() => n.remove(), 5000);        }        function showSuccess(msg) {            const el = document.getElementById('successMsg');            document.getElementById('successText').textContent = msg;            el.style.display = 'block';            document.getElementById('errorMsg').style.display = 'none';            setTimeout(() => el.style.display = 'none', 3000);        }        function showError(msg) {            const el = document.getElementById('errorMsg');            document.getElementById('errorText').textContent = msg;            el.style.display = 'block';            document.getElementById('successMsg').style.display = 'none';            setTimeout(() => el.style.display = 'none', 4000);        }        function getToken() {            try {                const s = localStorage.getItem('sparta_current_user');                const u = typeof CryptoUtils !== 'undefined' ? CryptoUtils.decrypt(s) : JSON.parse(s);                return u?.token || null;            } catch { return null; }        }        // ── Discord UI ────────────────────────────────────────────        function renderDiscordLinked(d) {            document.getElementById('discordNotLinked').style.display = 'none';            document.getElementById('discordLinked').style.display = 'block';            const displayName = d.global_name || d.username;            document.getElementById('linkedDiscordDisplayName').textContent = displayName;            document.getElementById('linkedDiscordUsername').textContent = '@' + d.username;            const avatarEl = document.getElementById('linkedDiscordAvatar');            avatarEl.src = d.avatar                ? `https://cdn.discordapp.com/avatars/${d.id}/${d.avatar}.png?size=256`                : 'https://cdn.discordapp.com/embed/avatars/0.png';            const bannerEl = document.getElementById('linkedDiscordBanner');            const cardEl   = document.querySelector('.discord-connected-card');            if (d.banner) {                bannerEl.src = `https://cdn.discordapp.com/banners/${d.id}/${d.banner}.png?size=690`;            } else {                bannerEl.src = '';                bannerEl.style.background = d.banner_color || 'linear-gradient(135deg,#5865F2,#4752c4)';            }            cardEl.style.background = d.banner_color || '#313338';            document.getElementById('discordStatus').className = 'discord-status-indicator online';            document.getElementById('linkedDiscordBio').style.display = 'none';            // badges            const badgesEl = document.getElementById('discordBadges');            const flags = d.flags || 0, premium = d.premium_type || 0;            const badges = [];            if (flags & 1)   badges.push('<div class="discord-badge-item staff"><i class="fas fa-shield-alt"></i> Staff</div>');            if (flags & 2)   badges.push('<div class="discord-badge-item partner"><i class="fas fa-crown"></i> Partner</div>');            if (flags & 64)  badges.push('<div class="discord-badge-item bug"><i class="fas fa-bug"></i> Bug Hunter</div>');            if (premium >= 1) badges.push('<div class="discord-badge-item boost"><i class="fas fa-gem"></i> Nitro</div>');            badgesEl.innerHTML = badges.join('');            badgesEl.style.display = badges.length ? 'flex' : 'none';        }        function checkDiscordLinked() {            if (!currentUser) return;            if (currentUser.discord_id) {                renderDiscordLinked({                    id: currentUser.discord_id,                    username: currentUser.discord_username || 'usuario',                    global_name: currentUser.discord_global_name,                    avatar: currentUser.discord_avatar,                    banner: currentUser.discord_banner,                    banner_color: currentUser.discord_banner_color,                    flags: currentUser.discord_flags || 0,                    premium_type: currentUser.discord_premium || 0                });            } else {                document.getElementById('discordNotLinked').style.display = 'block';                document.getElementById('discordLinked').style.display = 'none';            }        }        // ── OAuth callback ────────────────────────────────────────        async function handleOAuthCallback() {            const params = new URLSearchParams(window.location.search);            const code  = params.get('code');            const state = params.get('state');            const error = params.get('error');            // Limpa URL            window.history.replaceState({}, document.title, window.location.pathname);            if (error) { notify('Erro Discord: ' + error, 'error'); return; }            if (!code)  return;            const savedState = sessionStorage.getItem('discord_oauth_state');            if (state !== savedState) { notify('Estado inválido. Tente novamente.', 'error'); return; }            sessionStorage.removeItem('discord_oauth_state');            const type = sessionStorage.getItem('discord_oauth_type') || 'link';            sessionStorage.removeItem('discord_oauth_type');            notify('Processando Discord...', 'info');            if (type === 'login') {                // Login via Discord                try {                    const res = await fetch(`${API}/discord/login`, {                        method: 'POST',                        headers: { 'Content-Type': 'application/json' },                        body: JSON.stringify({ code })                    });                    const data = await res.json();                    if (!data.success) { notify(data.error || 'Conta não vinculada a nenhum Discord.', 'error'); return; }                    const userData = { ...data.user, token: data.token };                    localStorage.setItem('sparta_current_user',                        typeof CryptoUtils !== 'undefined' ? CryptoUtils.encrypt(userData) : JSON.stringify(userData));                    notify('Login com Discord realizado!', 'success');                    setTimeout(() => window.location.href = '/', 1000);                } catch (e) {                    notify('Erro ao fazer login com Discord.', 'error');                }            } else {                // Vincular Discord à conta atual                const token = getToken();                if (!token) { notify('Faça login primeiro.', 'error'); return; }                try {                    const res = await fetch(`${API}/discord/link`, {                        method: 'POST',                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },                        body: JSON.stringify({ code })                    });                    const data = await res.json();                    if (!data.success) { notify(data.error || 'Erro ao vincular.', 'error'); return; }                    // Atualiza localStorage                    currentUser.discord_id           = data.discord.id;                    currentUser.discord_username     = data.discord.username;                    currentUser.discord_global_name  = data.discord.global_name;                    currentUser.discord_avatar       = data.discord.avatar;                    currentUser.discord_banner       = data.discord.banner;                    currentUser.discord_banner_color = data.discord.banner_color;                    currentUser.discord_flags        = data.discord.flags;                    currentUser.discord_premium      = data.discord.premium_type;                    localStorage.setItem('sparta_current_user',                        typeof CryptoUtils !== 'undefined' ? CryptoUtils.encrypt(currentUser) : JSON.stringify(currentUser));                    renderDiscordLinked(data.discord);                    notify('Discord vinculado com sucesso!', 'success');                } catch (e) {                    notify('Erro ao vincular Discord.', 'error');                }            }        }        // ── Botões Discord ────────────────────────────────────────        function linkDiscord() {
            const state = Math.random().toString(36).substring(2, 15);
            sessionStorage.setItem('discord_oauth_state', state);
            sessionStorage.setItem('discord_oauth_type', 'link');
            const redirectUri = window.location.origin + '/settings';
            fetch('config.json').then(r => r.json()).then(cfg => {
                const clientId = (cfg.discord && cfg.discord.client_id) || 'SEU_CLIENT_ID';
                window.location.href = `https://discord.com/api/oauth2/authorize?response_type=code&client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=identify&state=${state}`;
            }).catch(e => {
                console.error('Falha ao carregar config.json:', e);
                window.location.href = `https://discord.com/api/oauth2/authorize?response_type=code&client_id=SEU_CLIENT_ID&redirect_uri=${encodeURIComponent(redirectUri)}&scope=identify&state=${state}`;
            });
        }        function unlinkDiscord() {            if (!confirm('Desvincular Discord?')) return;            const token = getToken();            fetch(`${API}/user/profile`, {                method: 'PUT',                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },                body: JSON.stringify({ discord_id: null })            }).then(() => {                delete currentUser.discord_id;                delete currentUser.discord_username;                delete currentUser.discord_avatar;                localStorage.setItem('sparta_current_user',                    typeof CryptoUtils !== 'undefined' ? CryptoUtils.encrypt(currentUser) : JSON.stringify(currentUser));                document.getElementById('discordNotLinked').style.display = 'block';                document.getElementById('discordLinked').style.display = 'none';                showSuccess('Discord desvinculado!');            });        }        // ── Init ──────────────────────────────────────────────────        document.addEventListener('DOMContentLoaded', function() {            const stored = localStorage.getItem('sparta_current_user');            if (!stored) { window.location.href = '/'; return; }            currentUser = typeof CryptoUtils !== 'undefined' ? CryptoUtils.decrypt(stored) : JSON.parse(stored);            if (!currentUser) { window.location.href = '/'; return; }            document.getElementById('userAvatar').src = `https://mc-heads.net/avatar/${currentUser.nickname}`;            document.getElementById('userEmailDisplay').textContent = currentUser.email;            document.getElementById('settingsNickname').value = currentUser.nickname;            document.getElementById('settingsEmail').value = currentUser.email;            checkDiscordLinked();            handleOAuthCallback();            // Salvar configurações via API            document.getElementById('settingsForm').addEventListener('submit', async function(e) {                e.preventDefault();                const nickname = document.getElementById('settingsNickname').value.trim();                const email    = document.getElementById('settingsEmail').value.trim();                const password = document.getElementById('settingsPassword').value;                const confirm  = document.getElementById('settingsConfirmPassword').value;                if (password && password.length < 4) return showError('Senha muito curta!');                if (password && password !== confirm) return showError('Senhas não coincidem!');                const token = getToken();                const body  = { nickname, email };                if (password) body.password = password;                try {                    const res  = await fetch(`${API}/user/profile`, {                        method: 'PUT',                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },                        body: JSON.stringify(body)                    });                    const data = await res.json();                    if (data.error) return showError(data.error);                    currentUser.nickname = nickname;                    currentUser.email    = email;                    localStorage.setItem('sparta_current_user',                        typeof CryptoUtils !== 'undefined' ? CryptoUtils.encrypt(currentUser) : JSON.stringify(currentUser));                    showSuccess('Configurações salvas!');                } catch (e) {                    showError('Erro ao salvar. Verifique o servidor.');                }            });        });    </script></body></html>
